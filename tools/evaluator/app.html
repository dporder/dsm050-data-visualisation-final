<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#202020">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg">
<title>Software labeling study</title>
<style>
:root {
  color-scheme: light;
  --paper: #f6f7f7;
  --cream: #faf0e1;
  --panel: #fff;
  --raised: #f0f1f1;
  --raised-2: #fafafa;
  --line: #767e81;
  --line-bright: #202020;
  --text: #202020;
  --dim: #565d60;
  --faint: #6b7376;
  --gold: #ffcd6e;
  --gold-soft: #fff1cf;
  --blue: #3255c3;
  --blue-soft: #e8edfb;
  --periwinkle: #91a7d2;
  --charcoal: #37424a;
  --danger: #a61736;
  --danger-soft: #fff0f3;
  --focus: #1d4ed8;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: linear-gradient(90deg, var(--gold) 0 12px, transparent 12px), var(--paper);
  color: var(--text);
  font: 16px/1.45 Arial, Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: var(--blue); }
.skip-link {
  position: fixed;
  z-index: 100;
  left: 24px;
  top: 8px;
  transform: translateY(-150%);
  background: var(--gold);
  color: var(--text);
  border: 2px solid var(--text);
  padding: 10px 14px;
  font-weight: 800;
  text-decoration: none;
}
.skip-link:focus { transform: translateY(0); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.hidden { display: none !important; }
.top {
  position: sticky;
  top: 0;
  z-index: 20;
  color: #fff;
  background: rgba(32, 32, 32, .98);
  border-bottom: 4px solid var(--gold);
}
.toprow {
  min-height: 64px;
  padding: 8px 24px 8px 28px;
  display: grid;
  grid-template-columns: auto minmax(180px, 1fr) auto minmax(230px, auto);
  align-items: center;
  gap: 24px;
}
.institution { padding-right: 22px; border-right: 1px solid #697075; color: #fff; line-height: 1.05; white-space: nowrap; }
.institution strong { display: block; font-size: 13px; letter-spacing: .02em; }
.institution span { display: block; margin-top: 4px; color: #cdd1d2; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.crumb { color: #cdd1d2; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb a { color: #fff; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.crumb a:hover { color: var(--gold); }
.progress-copy { text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; color: #cdd1d2; white-space: nowrap; }
.progress-copy strong { color: #fff; font-size: 16px; }
.runstats { display: flex; justify-content: flex-end; align-items: center; gap: 12px; color: #dfe1e2; font-size: 12px; white-space: nowrap; }
.rater {
  color: var(--text);
  background: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 2px;
  padding: 5px 8px;
  font-weight: 700;
}
.progress-track { height: 4px; background: #697075; }
.progress-fill { height: 100%; width: 0; background: var(--periwinkle); transition: width .14s ease; }
.workspace {
  width: min(1540px, calc(100% - 32px));
  margin: 0 auto;
  padding: 26px 0 92px;
}
.identity {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 20px;
  margin-bottom: 20px;
  padding: 0 4px;
}
.eyebrow {
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: .11em;
  font-size: 10px;
  font-weight: 800;
}
.project-name {
  width: fit-content;
  max-width: 100%;
  margin: 7px 0 0;
  padding: 3px 9px 5px 7px;
  color: var(--text);
  background: var(--gold);
  font-family: "Arial Narrow", "Aptos Narrow", Arial, Helvetica, sans-serif;
  font-size: clamp(30px, 4vw, 52px);
  font-stretch: condensed;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -.045em;
  overflow-wrap: anywhere;
}
.page-title { margin: 9px 0 0; color: var(--dim); font-size: 15px; max-width: 85ch; }
.source-links { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
.source-link, .ghost-button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 44px;
  border: 1px solid var(--text);
  border-radius: 2px;
  color: var(--text);
  background: var(--panel);
  padding: 9px 12px;
  text-decoration-line: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.source-link:hover, .ghost-button:hover { color: #fff; background: var(--text); }
.main-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(470px, .82fr);
  gap: 20px;
  align-items: start;
}
.preview-shell, .decision {
  border: 1px solid var(--text);
  background: var(--panel);
  border-radius: 2px;
  overflow: hidden;
}
.preview-shell { min-height: 570px; }
.panel-head {
  min-height: 48px;
  border-bottom: 1px solid var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 13px 8px 16px;
  color: var(--dim);
  font-size: 13px;
}
.panel-head strong { color: var(--text); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.preview-actions { display: flex; align-items: center; gap: 8px; }
.preview-actions button, .preview-actions a {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  color: var(--blue);
  border: 0;
  background: transparent;
  cursor: pointer;
  padding: 7px;
  text-decoration: underline;
  text-underline-offset: 3px;
  font-size: 13px;
}
.preview-actions button:hover, .preview-actions a:hover { color: var(--text); }
.preview-stage {
  position: relative;
  height: clamp(525px, 67vh, 760px);
  background:
    linear-gradient(45deg, rgba(55,66,74,.045) 25%, transparent 25%, transparent 75%, rgba(55,66,74,.045) 75%),
    linear-gradient(45deg, rgba(55,66,74,.045) 25%, transparent 25%, transparent 75%, rgba(55,66,74,.045) 75%),
    #eceeee;
  background-size: 24px 24px;
  background-position: 0 0, 12px 12px;
}
.preview-stage iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.preview-message {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 28px;
  text-align: center;
  background: var(--raised);
}
.preview-message .inner { max-width: 430px; }
.preview-message h2 { font-size: 24px; margin: 0 0 7px; letter-spacing: -.02em; }
.preview-message p { color: var(--dim); margin: 0 0 17px; }
.loading-ring {
  width: 28px;
  height: 28px;
  margin: 0 auto 14px;
  border: 3px solid var(--line);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.decision {
  position: sticky;
  top: 88px;
  max-height: none;
  overflow: visible;
  border-top: 8px solid var(--gold);
}
.decision-inner { padding: 20px; }
.decision h2 {
  margin: 6px 0 8px;
  font-size: clamp(24px, 2.4vw, 32px);
  line-height: 1.12;
  letter-spacing: -.025em;
}
.belongs-copy { margin: 0 0 18px; color: var(--dim); font-size: 13px; max-width: 52ch; }
.options { display: grid; gap: 8px; }
.options.many { grid-template-columns: 1fr 1fr; gap: 7px; }
.answer {
  width: 100%;
  min-height: 54px;
  display: grid;
  grid-template-columns: 31px 1fr;
  align-items: center;
  gap: 9px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--panel);
  color: var(--text);
  padding: 8px 12px;
  cursor: pointer;
  line-height: 1.25;
}
.options.many .answer { min-height: 47px; font-size: 13px; padding: 6px 8px; grid-template-columns: 27px 1fr; }
.answer:hover { border-color: var(--text); background: var(--gold-soft); }
.answer:focus-visible { border-color: var(--text); background: var(--gold-soft); }
.key {
  width: 28px;
  height: 28px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--text);
  border-bottom-width: 3px;
  border-radius: 2px;
  color: #fff;
  background: var(--text);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}
.options.many .key { width: 25px; height: 25px; font-size: 10px; }
.utility {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.utility button {
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  text-align: left;
  padding: 8px 10px;
}
.utility button:hover { border-color: var(--line-bright); color: var(--text); }
.utility .reject { color: var(--danger); border-color: #d5909f; background: var(--danger-soft); font-weight: 700; }
.utility .reject:hover { border-color: var(--danger); background: #ffe2e8; }
.inline-key { color: var(--faint); font-weight: 750; float: right; margin-left: 8px; }
.note-box { margin-top: 11px; }
.note-box label { display: block; color: var(--dim); font-size: 13px; margin-bottom: 5px; }
.note-box input, .other-wrap input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: #fff;
  color: var(--text);
  min-height: 44px;
  padding: 10px 11px;
}
.note-box input:focus, .other-wrap input:focus { border-color: var(--text); }
.about-judgement {
  margin-top: 12px;
  color: var(--dim);
  font-size: 13px;
  border-top: 1px solid var(--line);
  padding-top: 11px;
}
.about-judgement summary { cursor: pointer; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
.about-content { padding: 9px 0 1px; }
.about-content h3 { margin: 12px 0 4px; color: var(--text); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.about-content h3:first-child { margin-top: 0; }
.about-content p { margin: 0; }
.about-options { margin: 5px 0 0; padding-left: 23px; color: var(--text); }
.about-options li + li { margin-top: 3px; }
.about-source { margin-top: 13px !important; padding-top: 9px; border-top: 1px solid var(--line); color: var(--dim); }
.about-source strong { color: var(--text); }
.methods-workspace {
  width: min(1180px, calc(100% - 48px));
  margin: 0 auto;
  padding: 42px 0 78px;
}
.methods-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 28px; margin-bottom: 24px; }
.methods-title {
  margin: 6px 0 9px;
  font-family: "Arial Narrow", "Aptos Narrow", Arial, Helvetica, sans-serif;
  font-size: clamp(40px, 6vw, 68px);
  font-stretch: condensed;
  font-weight: 900;
  line-height: .98;
  letter-spacing: -.05em;
}
.methods-intro { max-width: 72ch; margin: 0; color: var(--dim); font-size: 16px; }
.protocol {
  margin-bottom: 18px;
  border: 1px solid var(--text);
  border-left: 10px solid var(--gold);
  background: var(--panel);
  padding: 17px 20px;
}
.protocol h2 { margin: 0 0 5px; font-size: 18px; }
.protocol p { margin: 0; color: var(--dim); }
.methods-list { display: grid; gap: 18px; }
.method-task { border: 1px solid var(--text); border-top: 7px solid var(--periwinkle); background: var(--panel); padding: 22px; }
.method-task h2 { margin: 0; font-size: 27px; letter-spacing: -.025em; }
.method-task-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.method-task-title a { font-size: 13px; font-weight: 700; text-underline-offset: 3px; }
.method-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr); gap: 24px; align-items: start; }
.method-section h3 { margin: 0 0 9px; color: var(--dim); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.sampling-copy { margin: 0 0 12px; color: var(--dim); }
.sampling-facts { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 0 17px; border: 1px solid var(--line); }
.sampling-facts div { padding: 10px 12px; }
.sampling-facts div + div { border-left: 1px solid var(--line); }
.sampling-facts dt { color: var(--dim); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.sampling-facts dd { margin: 2px 0 0; color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.allocation { margin: 0; }
.allocation figcaption { margin-bottom: 7px; color: var(--text); font-size: 13px; font-weight: 800; }
.allocation svg { display: block; width: 100%; height: auto; overflow: visible; }
.allocation .track { fill: #e1e3e3; }
.allocation .mark { fill: var(--periwinkle); }
.allocation text { fill: var(--text); font-family: Arial, Helvetica, sans-serif; font-size: 11px; }
.allocation .cell-value { font-weight: 800; font-variant-numeric: tabular-nums; }
.progress-metrics { display: grid; grid-template-columns: repeat(2, 1fr); border: 1px solid var(--line); }
.progress-metric { min-height: 90px; padding: 12px; }
.progress-metric:nth-child(even) { border-left: 1px solid var(--line); }
.progress-metric:nth-child(n+3) { border-top: 1px solid var(--line); }
.progress-metric span { display: block; color: var(--dim); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.progress-metric strong { display: block; margin-top: 2px; color: var(--text); font-size: 24px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.progress-metric small { display: block; margin-top: 3px; color: var(--dim); }
.reason-counts { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }
.reason-counts strong { color: var(--text); }
.reason-counts ul { margin: 6px 0 0; padding-left: 19px; color: var(--text); }
.methods-error { border: 1px solid var(--danger); background: var(--danger-soft); color: #7d102a; padding: 16px; }
.prior {
  margin: 0 0 13px;
  border: 1px solid #8b702f;
  background: var(--gold-soft);
  color: var(--text);
  border-radius: 2px;
  padding: 9px 11px;
  font-size: 13px;
}
.keyrail {
  position: fixed;
  z-index: 15;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 9px 14px;
  border: 1px solid #000;
  border-radius: 2px;
  background: rgba(32, 32, 32, .98);
  color: #cdd1d2;
  font-size: 12px;
  white-space: nowrap;
}
.keyrail b { color: var(--gold); }
.keyrail button {
  min-height: 44px;
  margin: -5px -10px -5px 0;
  padding: 7px 10px;
  border: 1px solid #9aa0a2;
  border-radius: 2px;
  color: #fff;
  background: transparent;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}
.keyrail button:hover { color: var(--text); background: var(--gold); border-color: var(--gold); }
.shortcuts-off .key, .shortcuts-off .inline-key, .shortcuts-off .key-hint { opacity: .38; text-decoration: line-through; }
.toast {
  position: fixed;
  z-index: 60;
  left: 24px;
  bottom: 18px;
  max-width: min(480px, calc(100% - 32px));
  border: 2px solid var(--text);
  border-radius: 2px;
  background: var(--text);
  color: #fff;
  padding: 10px 14px;
}
.toast.good { border-color: #1d6534; background: #edf9f0; color: #164d28; }
.toast.bad { border-color: var(--danger); background: var(--danger-soft); color: #7d102a; }
.overlay {
  position: fixed;
  z-index: 50;
  inset: 0;
  padding: 20px;
  display: grid;
  place-items: center;
  background: rgba(32, 32, 32, .82);
}
.reject-sheet {
  width: min(660px, 100%);
  max-height: calc(100vh - 40px);
  overflow: auto;
  border: 2px solid var(--text);
  border-top: 10px solid var(--gold);
  border-radius: 2px;
  background: #fff;
  padding: 24px;
}
.reject-sheet h2 { margin: 3px 0 5px; font-size: 27px; letter-spacing: -.025em; }
.reject-sheet > p { margin: 0 0 17px; color: var(--dim); }
.reason-list { display: grid; gap: 8px; }
.reason {
  display: grid;
  grid-template-columns: 30px 1fr;
  align-items: center;
  text-align: left;
  gap: 10px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--text);
  border-radius: 2px;
  min-height: 48px;
  padding: 9px 11px;
  cursor: pointer;
}
.reason:hover { border-color: var(--danger); background: var(--danger-soft); }
.other-wrap { margin-top: 11px; }
.other-wrap label { display: block; margin: 0 0 6px; color: var(--dim); font-size: 13px; font-weight: 700; }
.other-row { display: flex; gap: 8px; margin-top: 8px; }
.other-row button { min-height: 44px; border: 1px solid var(--danger); background: var(--danger); color: #fff; border-radius: 2px; padding: 9px 13px; cursor: pointer; }
.cancel { margin-top: 14px; width: 100%; min-height: 44px; color: var(--dim); background: transparent; border: 1px solid transparent; padding: 8px; cursor: pointer; }
.cancel:hover { color: var(--text); border-color: var(--line); }
.done { width: min(760px, calc(100% - 32px)); margin: 10vh auto; text-align: center; }
.done-mark { width: 60px; height: 60px; display: grid; place-items: center; margin: auto; border-radius: 2px; background: var(--gold); color: var(--text); border: 1px solid var(--text); font-size: 27px; }
.done h1 { font-size: 40px; margin: 15px 0 6px; letter-spacing: -.035em; }
.done p { color: var(--dim); }
.tallies { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 25px 0; }
.tally { border: 1px solid var(--text); border-radius: 2px; background: var(--panel); padding: 14px; color: var(--dim); }
.tally strong { display: block; color: var(--text); font-size: 30px; }
.done-actions { display: flex; justify-content: center; gap: 9px; flex-wrap: wrap; }
.done-actions button, .done-actions a { min-height: 44px; border: 1px solid var(--text); border-radius: 2px; background: #fff; color: var(--text); padding: 10px 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.done-actions button:hover, .done-actions a:hover { background: var(--gold-soft); }
.loading-page { min-height: 80vh; display: grid; place-items: center; color: var(--dim); }
.preview-shell.no-preview { min-height: 0; }
.preview-shell.no-preview .preview-stage { height: auto; min-height: 0; }
.preview-shell.no-preview .preview-message { position: static; min-height: 190px; }
main[aria-busy="true"] .answer,
main[aria-busy="true"] .utility button { opacity: .58; cursor: wait; }
@media (max-width: 1260px) {
  .toprow { grid-template-columns: minmax(180px, 1fr) auto minmax(230px, auto); }
  .institution { display: none; }
}
@media (max-width: 1040px) {
  .main-grid { grid-template-columns: 1fr; }
  .decision { position: static; max-height: none; grid-row: 1; }
  .preview-shell { grid-row: 2; min-height: 460px; }
  .preview-stage { height: 55vh; min-height: 410px; }
  .method-grid { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  body { background: linear-gradient(90deg, var(--gold) 0 6px, transparent 6px), var(--paper); }
  .toprow { grid-template-columns: 1fr auto; gap: 10px; padding: 8px 12px 8px 16px; }
  .progress-copy { text-align: right; }
  .runstats { display: flex; grid-column: 1 / -1; justify-content: space-between; padding-top: 7px; border-top: 1px solid #697075; }
  .workspace { width: min(100% - 20px, 1540px); padding-top: 14px; }
  .identity { grid-template-columns: 1fr; }
  .source-links { justify-content: flex-start; }
  .options.many { grid-template-columns: 1fr; }
  .keyrail { left: auto; right: 10px; bottom: 10px; transform: none; padding: 5px; }
  .keyrail .key-hint { display: none; }
  .keyrail button { margin: 0; }
  .preview-shell { min-height: 380px; }
  .preview-stage { height: 48vh; min-height: 340px; }
  .decision-inner { padding: 16px; }
  .utility { grid-template-columns: 1fr; }
  .tallies { grid-template-columns: 1fr; }
  .methods-workspace { width: min(100% - 20px, 1180px); padding-top: 24px; }
  .methods-hero { grid-template-columns: 1fr; align-items: start; gap: 18px; }
  .method-task { padding: 16px; }
  .method-task-title { align-items: flex-start; flex-direction: column; gap: 5px; }
  .sampling-facts { grid-template-columns: 1fr; }
  .sampling-facts div + div { border-left: 0; border-top: 1px solid var(--line); }
  .progress-metrics { grid-template-columns: 1fr; }
  .progress-metric:nth-child(even) { border-left: 0; }
  .progress-metric:nth-child(n+2) { border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .loading-ring { animation: none; }
}
@media (forced-colors: active) {
  .project-name, .rater, .progress-fill, .done-mark { forced-color-adjust: none; }
}
</style>
</head>
<body>
<a class="skip-link" href="#judgement">Skip to judgment</a>
<header id="top" class="top hidden">
  <div class="toprow">
    <div class="institution"><strong>Goldsmiths</strong><span>University of London</span></div>
    <div class="crumb"><a id="backlink" href="/">All tasks</a> <span aria-hidden="true">/</span> <span id="tasktitle"></span></div>
    <div class="progress-copy" aria-live="polite"><strong id="position">0</strong> of <strong id="total">0</strong> <span id="timeleft"></span></div>
    <div class="runstats"><span id="margin"></span><span id="rater" class="rater"></span></div>

  <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressfill" class="progress-fill"></div></div>

<main id="app" class="workspace" tabindex="-1"><div class="loading-page">Loading the sample...</div></main>
<div id="itemannounce" class="sr-only" role="status" aria-live="polite"></div>

<div id="keyrail" class="keyrail hidden">

  <span class="key-hint" aria-hidden="true"><b>R</b> reject</span>
  <span class="key-hint" aria-hidden="true"><b>S</b> skip</span>
  <span class="key-hint" aria-hidden="true"><b>Z</b> undo</span>
  <span class="key-hint" aria-hidden="true"><b>N</b> note</span>

    <h2 id="rejecttitle">Why does this not belong?</h2>

      <div class="other-row"><button id="saveother" type="button">Save rejection <span class="inline-key">Enter</span></button></div>
    </div>
    <button id="cancelreject" class="cancel" type="button">Cancel <span class="inline-key">Esc</span></button>
  </section>
</div>

<script>
"use strict";

var IS_METHODS = location.pathname.replace(/\/$/, "") === "/methods";
var TASK_ID = decodeURIComponent(location.pathname.replace(/^\/t\//, "").replace(/\/$/, ""));
var params = new URLSearchParams(location.search);
var RATER_ID = "primary";   // The completed evaluation used one rater.
var task = null;
var judged = {};
var idx = 0;
var busy = false;
var rejectOpen = false;
var rejectReturnFocus = null;
var previewTimer = null;
var shortcutsEnabled = true;
var SHORTCUTS = ["1","2","3","4","5","6","7","8","9","0","A","B","C","D","E","F","G","H","I","J","K","L","M","P","Q"];

var app = document.getElementById("app");
var topbar = document.getElementById("top");
var tasktitle = document.getElementById("tasktitle");
var position = document.getElementById("position");
var total = document.getElementById("total");
var timeleft = document.getElementById("timeleft");
var margin = document.getElementById("margin");
var rater = document.getElementById("rater");
var fill = document.getElementById("progressfill");
var progressTrack = document.querySelector(".progress-track");
var keyrail = document.getElementById("keyrail");
var keyToggle = document.getElementById("keytoggle");
var toastEl = document.getElementById("toast");
var itemAnnounce = document.getElementById("itemannounce");
var rejectOverlay = document.getElementById("rejectoverlay");
var reasonList = document.getElementById("reasonlist");
var otherWrap = document.getElementById("otherwrap");
var otherReason = document.getElementById("otherreason");

document.getElementById("backlink").href = "/?rater=" + encodeURIComponent(RATER_ID);

try { shortcutsEnabled = localStorage.getItem("folk-evaluator-shortcuts") !== "off"; }
catch (error) { shortcutsEnabled = true; }

function applyShortcutPreference() {
  document.body.classList.toggle("shortcuts-off", !shortcutsEnabled);
  keyToggle.setAttribute("aria-pressed", shortcutsEnabled ? "true" : "false");
  keyToggle.textContent = shortcutsEnabled ? "Shortcut keys on" : "Shortcut keys off";
  var controls = document.querySelectorAll("[aria-keyshortcuts], [data-keyshortcut]");
  for (var i = 0; i < controls.length; i++) {
    if (shortcutsEnabled && controls[i].hasAttribute("data-keyshortcut")) {
      controls[i].setAttribute("aria-keyshortcuts", controls[i].getAttribute("data-keyshortcut"));
      controls[i].removeAttribute("data-keyshortcut");
    } else if (!shortcutsEnabled && controls[i].hasAttribute("aria-keyshortcuts")) {
      controls[i].setAttribute("data-keyshortcut", controls[i].getAttribute("aria-keyshortcuts"));
      controls[i].removeAttribute("aria-keyshortcuts");
    }
  }
}

keyToggle.addEventListener("click", function () {
  shortcutsEnabled = !shortcutsEnabled;
  try { localStorage.setItem("folk-evaluator-shortcuts", shortcutsEnabled ? "on" : "off"); }
  catch (error) {}
  applyShortcutPreference();
  toast("Single-key shortcuts " + (shortcutsEnabled ? "on" : "off"), "good", 1500);
});
applyShortcutPreference();

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function safeUrl(value) {
  try {
    var parsed = new URL(String(value || ""));
    return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "";
  } catch (error) {
    return "";
  }
}

function toast(message, kind, duration) {
  clearTimeout(toast._timer);
  toastEl.textContent = message;
  toastEl.className = "toast" + (kind ? " " + kind : "");
  if (duration !== 0) {
    toast._timer = setTimeout(function () { toastEl.classList.add("hidden"); }, duration || 1800);
  }
}

function formatNumber(value) {
  return new Intl.NumberFormat("en-GB").format(Number(value) || 0);
}

function formatShare(count, totalCount) {
  return totalCount ? (100 * count / totalCount).toFixed(1) + "%" : "Not available";
}

function wilsonMargin(totalCount, assumedAgreement) {
  if (!totalCount) return null;
  var z = 1.96;
  var zSquared = z * z;
  var denominator = 1 + zSquared / totalCount;
  return z * Math.sqrt((assumedAgreement * (1 - assumedAgreement) + zSquared / (4 * totalCount)) / totalCount) / denominator;
}

function renderAllocation(allocation, taskTitle, taskId) {
  var entries = Object.keys(allocation || {}).map(function (label) {
    return {label: label, value: Number(allocation[label]) || 0};
  });
  if (!entries.length) return "<p class='sampling-copy'>No allocation cells are recorded.</p>";
  var width = 640;
  var labelWidth = 205;
  var barWidth = 390;
  var rowHeight = 20;
  var height = entries.length * rowHeight + 8;
  var maximum = Math.max.apply(null, entries.map(function (entry) { return entry.value; }).concat([1]));
  var titleId = "allocation-title-" + taskId;
  var descId = "allocation-desc-" + taskId;
  var html = "<figure class='allocation'><figcaption>Allocation per cell</figcaption>";
  html += "<svg viewBox='0 0 " + width + " " + height + "' role='img' aria-labelledby='" + esc(titleId) + " " + esc(descId) + "'>";
  html += "<title id='" + esc(titleId) + "'>" + esc(taskTitle) + " sample allocation</title>";
  html += "<desc id='" + esc(descId) + "'>Horizontal bars show the number of sampled items in each stratification cell.</desc>";
  entries.forEach(function (entry, index) {
    var baseline = 16 + index * rowHeight;
    var markWidth = barWidth * entry.value / maximum;
    html += "<text x='0' y='" + baseline + "'>" + esc(entry.label) + "</text>";
    html += "<rect class='track' x='" + labelWidth + "' y='" + (baseline - 9) + "' width='" + barWidth + "' height='8'></rect>";
    if (markWidth > 0) html += "<rect class='mark' x='" + labelWidth + "' y='" + (baseline - 9) + "' width='" + markWidth.toFixed(2) + "' height='8'></rect>";
    html += "<text class='cell-value' x='" + (width - 2) + "' y='" + baseline + "' text-anchor='end'>" + formatNumber(entry.value) + "</text>";
  });
  return html + "</svg></figure>";
}

function renderReasonCounts(counts) {
  var reasons = Object.keys(counts || {}).sort(function (left, right) {
    return counts[right] - counts[left] || left.localeCompare(right);
  });
  if (!reasons.length) return "<p class='reason-counts'><strong>Rejection reasons:</strong> none recorded.</p>";
  var html = "<div class='reason-counts'><strong>Rejection reasons</strong><ul>";
  reasons.forEach(function (reason) {
    html += "<li>" + esc(reason) + ": <strong>" + formatNumber(counts[reason]) + "</strong></li>";
  });
  return html + "</ul></div>";
}

function renderMethodsTask(methodTask, summary) {
  var sampling = methodTask.sampling || {};
  var populations = sampling.populations || [];
  var populationCopy = populations.length
    ? populations.map(function (population) {
        return esc(population.label || population.id || "Population") + ": " + formatNumber(population.N);
      }).join("; ")
    : "Not recorded";
  var judgedCountValue = Number(summary.n_judged) || 0;
  var cannotTellCount = Number(methodTask.n_cannot_tell) || 0;
  var rejectedCountValue = Number(summary.n_rejected) || 0;
  var marginValue = wilsonMargin(judgedCountValue, 0.8);
  var marginCopy = marginValue == null ? "Not available" : "±" + (marginValue * 100).toFixed(1) + " percentage points";
  var marginNote = marginValue == null ? "No judgments yet" : "Assumed agreement 0.8, n = " + formatNumber(judgedCountValue);
  var html = "<article class='method-task' aria-labelledby='method-" + esc(methodTask.task_id) + "'>";
  html += "<div class='method-task-title'><h2 id='method-" + esc(methodTask.task_id) + "'>" + esc(methodTask.title) + "</h2>";
  html += "<a href='/t/" + encodeURIComponent(methodTask.task_id) + "?rater=" + encodeURIComponent(RATER_ID) + "'>Open task</a></div>";
  html += "<div class='method-grid'><section class='method-section'><h3>Sampling design</h3>";
  html += "<p class='sampling-copy'>" + esc(sampling.method || "Sampling method not recorded") + ".</p>";
  html += "<dl class='sampling-facts'><div><dt>Population size</dt><dd>" + populationCopy + "</dd></div>";
  html += "<div><dt>Stratification column</dt><dd>" + esc(sampling.stratify_column || "Not recorded") + "</dd></div>";
  html += "<div><dt>Seed</dt><dd>" + esc(sampling.seed == null ? "Not recorded" : sampling.seed) + "</dd></div></dl>";
  html += renderAllocation(sampling.allocation, methodTask.title, methodTask.task_id) + "</section>";
  html += "<section class='method-section'><h3>Live progress</h3><div class='progress-metrics'>";
  html += "<div class='progress-metric'><span>Items judged</span><strong>" + formatNumber(judgedCountValue) + " of " + formatNumber(summary.n_items) + "</strong><small>Saved labels and rejections</small></div>";
  html += "<div class='progress-metric'><span>Cannot tell</span><strong>" + formatShare(cannotTellCount, judgedCountValue) + "</strong><small>" + formatNumber(cannotTellCount) + " of " + formatNumber(judgedCountValue) + " judged</small></div>";
  html += "<div class='progress-metric'><span>Rejected</span><strong>" + formatShare(rejectedCountValue, judgedCountValue) + "</strong><small>" + formatNumber(rejectedCountValue) + " of " + formatNumber(judgedCountValue) + " judged</small></div>";
  html += "<div class='progress-metric'><span>Wilson 95 per cent margin</span><strong>" + marginCopy + "</strong><small>" + esc(marginNote) + "</small></div></div>";
  html += renderReasonCounts(methodTask.reject_reason_counts) + "</section></div></article>";
  return html;
}

function loadMethods() {
  document.querySelector(".skip-link").href = "#methods";
  document.querySelector(".skip-link").textContent = "Skip to methods";
  app.className = "methods-workspace";
  topbar.classList.remove("hidden");
  document.querySelector(".progress-copy").classList.add("hidden");
  document.querySelector(".runstats").classList.add("hidden");
  document.querySelector(".progress-track").classList.add("hidden");
  tasktitle.textContent = "Methods";
  document.title = "Methods | Software labeling study";
  Promise.all([
    fetch("/api/tasks?rater=" + encodeURIComponent(RATER_ID)).then(function (response) { return response.json(); }),
    fetch("/api/methods?rater=" + encodeURIComponent(RATER_ID)).then(function (response) { return response.json(); })
  ]).then(function (responses) {
    var summaries = responses[0];
    var methods = responses[1];
    if (!summaries.ok || !methods.ok) throw new Error("Could not load the methods data");
    var summaryByTask = {};
    summaries.tasks.forEach(function (summary) { summaryByTask[summary.task_id] = summary; });
    var html = "<header class='methods-hero'><div><div class='eyebrow'>Measurement design</div><h1 class='methods-title'>Judgment methods</h1>";
    html += "<p class='methods-intro'>Sampling and live human judgment progress for every validation task. All figures below are read from the task and result files.</p></div>";
    html += "<a class='source-link' href='/?rater=" + encodeURIComponent(RATER_ID) + "'>Back to task menu</a></header>";
    html += "<section class='protocol' aria-labelledby='protocol-title'><h2 id='protocol-title'>Alignment protocol</h2>";
    html += "<p>Items 1 to 40 form the working set with four rotating development folds of ten. In each fold, 30 items are used to tune the prompt and ten unseen items are used to test it. Items 41 to 50 are sealed until a single final scoring.</p></section>";
    html += "<section id='methods' class='methods-list' aria-label='Methods by task'>";
    methods.tasks.forEach(function (methodTask) {
      var summary = summaryByTask[methodTask.task_id] || {n_items: 0, n_judged: 0, n_rejected: 0};
      html += renderMethodsTask(methodTask, summary);
    });
    app.innerHTML = html + "</section>";
  }).catch(function (error) {
    app.innerHTML = "<div class='methods-error'>Could not load methods. " + esc(error.message) + " <a href='/?rater=" + esc(RATER_ID) + "'>Back to tasks</a></div>";
  });
}

function post(path, payload) {
  return fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  }).then(function (response) {
    return response.json().catch(function () { throw new Error("The server returned an unreadable response"); });
  });
}

function firstUnjudged() {
  for (var i = 0; i < task.items.length; i++) {
    if (!judged[task.items[i].id]) return i;
  }
  return -1;
}

function nextUnjudged(after) {
  for (var i = after + 1; i < task.items.length; i++) {
    if (!judged[task.items[i].id]) return i;
  }
  return task.items.length;
}

function getField(item, wanted) {
  var fields = item.fields || {};
  var keys = Object.keys(fields);
  for (var i = 0; i < keys.length; i++) {
    if (keys[i].toLowerCase() === wanted) return fields[keys[i]];
  }
  return "";
}

function judgedCount() {
  return Object.keys(judged).length;
}

function rejectedCount() {
  var count = 0;
  Object.keys(judged).forEach(function (key) {
    if (judged[key].verdict === "reject") count++;
  });
  return count;
}

function updateProgress(summary) {
  var done = judgedCount();
  total.textContent = task.items.length;
  position.textContent = idx >= task.items.length ? task.items.length : idx + 1;
  var left = Math.max(0, task.items.length - done);
  var minutes = left ? Math.max(1, Math.round(left * 14 / 60)) : 0;
  timeleft.textContent = minutes ? " · about " + minutes + " min left" : "";
  var percent = task.items.length ? 100 * done / task.items.length : 0;
  fill.style.width = percent + "%";
  progressTrack.setAttribute("aria-valuenow", String(Math.round(percent)));
  progressTrack.setAttribute("aria-valuetext", done + " of " + task.items.length + " judged");
  var currentMargin = summary && summary.widest_margin != null ? summary.widest_margin : task.widest_margin;
  margin.textContent = currentMargin != null ? "Current 95% margin ±" + (currentMargin * 100).toFixed(1) + " points" : "95% margin calculating";
}

function load() {
  fetch("/api/task/" + encodeURIComponent(TASK_ID) + "?rater=" + encodeURIComponent(RATER_ID))
    .then(function (response) { return response.json(); })
    .then(function (data) {
      if (!data || !data.ok) throw new Error((data && data.error) || "Could not load this task");
      task = data;
      judged = data.judged || {};
      idx = firstUnjudged();
      if (idx < 0) idx = task.items.length;
      tasktitle.textContent = task.title;
      rater.textContent = task.rater_label;
      document.title = task.title + " | Software labeling study";
      topbar.classList.remove("hidden");
      keyrail.classList.remove("hidden");
      buildRejectReasons();
      render();
    })
    .catch(function (error) {
      app.innerHTML = "<div class='loading-page'><div>Could not load this task.<br><br>" + esc(error.message) + "<br><br><a href='/?rater=" + esc(RATER_ID) + "'>Back to tasks</a></div></div>";
    });
}

function renderAboutJudgement() {
  var html = "<details id='aboutjudgement' class='about-judgement'>";
  html += "<summary aria-keyshortcuts='?'>About this judgment <span class='inline-key'>?</span></summary>";
  html += "<div class='about-content'><h3>Official definition</h3><p>" + esc(task.instructions) + "</p>";
  html += "<h3>Answer options</h3><ol class='about-options'>";
  task.options.forEach(function (option) { html += "<li>" + esc(option) + "</li>"; });
  html += "</ol><p class='about-source'><strong>Source and vocabulary note:</strong> " + esc(task.vocabulary_note) + "</p></div></details>";
  return html;
}

function toggleAbout() {
  var about = document.getElementById("aboutjudgement");
  if (!about) return;
  about.open = !about.open;
  if (about.open) about.scrollIntoView({block: "nearest"});
}

function render(focusProject) {
  clearTimeout(previewTimer);
  if (!task || !task.items.length) return;
  if (idx >= task.items.length) return renderDone();
  updateProgress();
  var item = task.items[idx];
  var prior = judged[item.id];
  var liveUrl = safeUrl(getField(item, "live app"));
  var codeUrl = safeUrl(getField(item, "code"));
  var pageTitle = getField(item, "page title");
  var html = "";

  html += "<section class='identity' aria-labelledby='projectname'><div><div class='eyebrow'>Blind review · Item " + (idx + 1) + " of " + task.items.length + "</div>";
  html += "<h1 id='projectname' class='project-name' tabindex='-1'>" + esc(item.primary) + "</h1>";
  if (pageTitle) html += "<p class='page-title'>" + esc(pageTitle) + "</p>";
  html += "</div><div class='source-links'>";
  if (liveUrl) html += "<a class='source-link' href='" + esc(liveUrl) + "' target='_blank' rel='noopener noreferrer'>Open live app <span aria-hidden='true'>↗</span><span class='sr-only'> (opens in a new tab)</span></a>";
  if (codeUrl) html += "<a class='source-link' href='" + esc(codeUrl) + "' target='_blank' rel='noopener noreferrer'>Open code <span aria-hidden='true'>↗</span><span class='sr-only'> (opens in a new tab)</span></a>";
  html += "</div></section>";

  html += "<div class='main-grid'>";
  html += renderPreview(liveUrl);
  html += "<section id='judgement' class='decision' aria-labelledby='question' tabindex='-1'><div class='decision-inner'><div class='eyebrow'>One question</div>";
  html += "<h2 id='question'>" + esc(task.question) + "</h2>";
  html += "<p class='belongs-copy'>Choose the best answer. It saves immediately and moves on. If this should not be in the study at all, use the button below and say why.</p>";
  if (prior) {
    var priorText = prior.verdict === "reject"
      ? "Previously rejected: " + (prior.reject_reason || "reason not recorded")
      : "Your saved answer: " + (prior.human_label || "blank");
    html += "<div class='prior'>" + esc(priorText) + "</div>";
  }
  html += "<div class='options" + (task.options.length > 8 ? " many" : "") + "'>";
  for (var i = 0; i < task.options.length; i++) {
    var shortcut = SHORTCUTS[i] || "";
    html += "<button class='answer' type='button' data-answer='" + esc(task.options[i]) + "' aria-keyshortcuts='" + esc(shortcut) + "'>";
    html += "<span class='key'>" + esc(shortcut) + "</span><span>" + esc(task.options[i]) + "</span></button>";
  }
  html += "</div>";
  html += "<div class='utility'>";
  html += "<button class='reject' type='button' data-action='reject' aria-keyshortcuts='R'>This should not be in the study <span class='inline-key'>R</span></button>";
  html += "<button type='button' data-action='skip' aria-keyshortcuts='S'>Skip for now <span class='inline-key'>S</span></button>";
  html += "<button type='button' data-action='undo' aria-keyshortcuts='Z'>Undo last judgment <span class='inline-key'>Z</span></button>";
  html += "<button type='button' data-action='note' aria-keyshortcuts='N'>Add a note <span class='inline-key'>N</span></button>";
  html += "</div>";
  html += "<div id='notewrap' class='note-box" + (prior && prior.note ? "" : " hidden") + "'>";
  html += "<label for='notebox'>Optional note. It saves with your next answer.</label>";
  html += "<input id='notebox' type='text' maxlength='1000' autocomplete='off' value='" + esc(prior && prior.note ? prior.note : "") + "'></div>";
  html += renderAboutJudgement();
  html += "</div></section></div>";
  app.innerHTML = html;
  bindItem();
  setupPreview(liveUrl);
  applyShortcutPreference();
  itemAnnounce.textContent = "Project " + (idx + 1) + " of " + task.items.length + ": " + item.primary;
  if (focusProject) {
    requestAnimationFrame(function () {
      var projectName = document.getElementById("projectname");
      if (projectName) projectName.focus({preventScroll: true});
    });
  }
}

function renderPreview(liveUrl) {
  var html = "<section class='preview-shell" + (liveUrl ? "" : " no-preview") + "' aria-labelledby='previewtitle'><div class='panel-head'><strong id='previewtitle'>Live preview</strong><div class='preview-actions'>";
  if (liveUrl) {
    html += "<button type='button' id='previewfailed'>Preview blank or blocked?</button>";
    html += "<a href='" + esc(liveUrl) + "' target='_blank' rel='noopener noreferrer'>Open in a new tab <span aria-hidden='true'>↗</span><span class='sr-only'> (opens in a new tab)</span></a>";
  }
  html += "</div></div><div id='previewstage' class='preview-stage'>";
  if (liveUrl) {
    html += "<iframe id='previewframe' src='" + esc(liveUrl) + "' title='Live app preview' tabindex='-1' sandbox='allow-scripts allow-same-origin' referrerpolicy='no-referrer'></iframe>";
    html += "<div id='previewloading' class='preview-message'><div class='inner'><div class='loading-ring' aria-hidden='true'></div><p>Loading the app preview...</p></div></div>";
    html += "<div id='previewfallback' class='preview-message hidden'><div class='inner'><h2>Preview unavailable</h2><p>The app may still work. Open it in a new tab, use the other evidence, or choose Cannot tell.</p><a class='source-link' href='" + esc(liveUrl) + "' target='_blank' rel='noopener noreferrer'>Open live app <span aria-hidden='true'>↗</span><span class='sr-only'> (opens in a new tab)</span></a></div></div>";
  } else {
    html += "<div class='preview-message'><div class='inner'><h2>Judge from the name</h2><p>The project's name is the only evidence the classifier ever saw, so judge from the name. The page title and code link are there if you are curious. Choose Cannot tell only when the name itself says nothing.</p></div></div>";
  }
  html += "</div></section>";
  return html;
}

function setupPreview(liveUrl) {
  if (!liveUrl) return;
  var frame = document.getElementById("previewframe");
  var loading = document.getElementById("previewloading");
  if (!frame || !loading) return;
  function loaded() {
    clearTimeout(previewTimer);
    loading.classList.add("hidden");
  }
  frame.addEventListener("load", loaded, {once: true});
  frame.addEventListener("error", showPreviewFallback, {once: true});
  previewTimer = setTimeout(showPreviewFallback, 6500);
  var failedButton = document.getElementById("previewfailed");
  if (failedButton) failedButton.addEventListener("click", showPreviewFallback);
}

function showPreviewFallback() {
  clearTimeout(previewTimer);
  var frame = document.getElementById("previewframe");
  var loading = document.getElementById("previewloading");
  var fallback = document.getElementById("previewfallback");
  if (frame) frame.classList.add("hidden");
  if (loading) loading.classList.add("hidden");
  if (fallback) fallback.classList.remove("hidden");
}

function bindItem() {
  var answers = app.querySelectorAll("[data-answer]");
  for (var i = 0; i < answers.length; i++) {
    answers[i].addEventListener("click", function () { saveLabel(this.getAttribute("data-answer")); });
  }
  var actions = app.querySelectorAll("[data-action]");
  for (var j = 0; j < actions.length; j++) {
    actions[j].addEventListener("click", function () {
      var action = this.getAttribute("data-action");
      if (action === "reject") openReject();
      if (action === "skip") skip();
      if (action === "undo") undo();
      if (action === "note") openNote();
    });
  }
  var note = document.getElementById("notebox");
  if (note) {
    note.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === "Escape") {
        event.preventDefault();
        note.blur();
      }
    });
  }
}

function currentNote() {
  var note = document.getElementById("notebox");
  return note ? note.value : "";
}

function openNote() {
  var wrap = document.getElementById("notewrap");
  var note = document.getElementById("notebox");
  if (!wrap || !note) return;
  wrap.classList.remove("hidden");
  note.focus();
  note.setSelectionRange(note.value.length, note.value.length);
}

function payloadBase() {
  return {task_id: task.task_id, item_id: task.items[idx].id, rater_id: RATER_ID, note: currentNote()};
}

function saveLabel(label) {
  if (busy || idx >= task.items.length) return;
  var payload = payloadBase();
  payload.verdict = "label";
  payload.human_label = label;
  save(payload, label);
}

function skip() {
  if (busy || idx >= task.items.length) return;
  var payload = payloadBase();
  payload.verdict = "skip";
  save(payload, "Skipped");
}

function saveReject(reason, other) {
  if (busy || idx >= task.items.length) return;
  var payload = payloadBase();
  payload.verdict = "reject";
  payload.reject_reason = reason;
  payload.reject_other = other || "";
  closeReject(false);
  save(payload, "Rejected");
}

function save(payload, message) {
  busy = true;
  app.setAttribute("aria-busy", "true");
  setItemControlsDisabled(true);
  toast("Saving...", "", 0);
  post("/api/judge", payload).then(function (response) {
    if (!response.ok) throw new Error(response.error || "The server refused the judgment");
    if (payload.verdict === "label") {
      judged[payload.item_id] = {verdict: "label", human_label: payload.human_label, belongs: "yes", note: payload.note};
    } else if (payload.verdict === "reject") {
      judged[payload.item_id] = {verdict: "reject", reject_reason: payload.reject_reason, reject_other: payload.reject_other, belongs: "no", note: payload.note};
    }
    task.widest_margin = response.widest_margin;
    busy = false;
    app.removeAttribute("aria-busy");
    toast(message + " and saved", "good", 1000);
    idx = nextUnjudged(idx);
    render(true);
  }).catch(function (error) {
    busy = false;
    app.removeAttribute("aria-busy");
    setItemControlsDisabled(false);
    toast("Not saved: " + error.message + ". This item has not moved.", "bad", 0);
  });
}

function setItemControlsDisabled(disabled) {
  var controls = app.querySelectorAll("button");
  for (var i = 0; i < controls.length; i++) controls[i].disabled = disabled;
}

function undo() {
  if (busy) return;
  busy = true;
  setItemControlsDisabled(true);
  toast("Undoing...", "", 0);
  post("/api/undo", {task_id: task.task_id, rater_id: RATER_ID}).then(function (response) {
    busy = false;
    if (!response.ok) throw new Error(response.error || "Nothing to undo");
    delete judged[response.item_id];
    task.widest_margin = response.widest_margin;
    idx = response.index >= 0 ? response.index : firstUnjudged();
    toast("Undone. Judge this item again.", "good", 1500);
    render(true);
  }).catch(function (error) {
    busy = false;
    setItemControlsDisabled(false);
    toast(error.message, "bad", 1800);
  });
}

function buildRejectReasons() {
  var html = "";
  for (var i = 0; i < task.reject_reasons.length; i++) {
    html += "<button class='reason' type='button' data-reason='" + esc(task.reject_reasons[i]) + "' aria-keyshortcuts='" + (i + 1) + "'>";
    html += "<span class='key'>" + (i + 1) + "</span><span>" + esc(task.reject_reasons[i]) + "</span></button>";
  }
  reasonList.innerHTML = html;
  var buttons = reasonList.querySelectorAll("[data-reason]");
  for (var j = 0; j < buttons.length; j++) {
    buttons[j].addEventListener("click", function () { chooseReason(this.getAttribute("data-reason")); });
  }
}

function openReject() {
  if (busy) return;
  rejectOpen = true;
  rejectReturnFocus = document.activeElement;
  otherReason.value = "";
  otherWrap.classList.add("hidden");
  rejectOverlay.classList.remove("hidden");
  topbar.setAttribute("inert", "");
  app.setAttribute("inert", "");
  keyrail.setAttribute("inert", "");
  document.querySelector(".skip-link").setAttribute("inert", "");
  document.body.style.overflow = "hidden";
  var first = reasonList.querySelector("button");
  if (first) first.focus();
}

function closeReject(restoreFocus) {
  rejectOpen = false;
  rejectOverlay.classList.add("hidden");
  otherWrap.classList.add("hidden");
  topbar.removeAttribute("inert");
  app.removeAttribute("inert");
  keyrail.removeAttribute("inert");
  document.querySelector(".skip-link").removeAttribute("inert");
  document.body.style.overflow = "";
  if (restoreFocus !== false && rejectReturnFocus && document.contains(rejectReturnFocus)) rejectReturnFocus.focus();
  rejectReturnFocus = null;
}

function chooseReason(reason) {
  if (reason === "Other") {
    otherWrap.classList.remove("hidden");
    otherReason.focus();
    return;
  }
  saveReject(reason, "");
}

function saveOther() {
  var value = otherReason.value.trim();
  if (!value) {
    otherReason.focus();
    toast("Write a short reason first", "bad", 1500);
    return;
  }
  saveReject("Other", value);
}

document.getElementById("cancelreject").addEventListener("click", closeReject);
document.getElementById("saveother").addEventListener("click", saveOther);
otherReason.addEventListener("keydown", function (event) {
  if (event.key === "Enter") { event.preventDefault(); saveOther(); }
  if (event.key === "Escape") { event.preventDefault(); closeReject(); }
});

function renderDone() {
  updateProgress();
  var done = judgedCount();
  var rejected = rejectedCount();
  var left = task.items.length - done;
  var message = left
    ? left + " item" + (left === 1 ? " is" : "s are") + " still unjudged. Skipped items return when you reopen the task."
    : "Every item has a saved judgment.";
  app.className = "";
  app.innerHTML = "<section class='done'><div class='done-mark'>✓</div><h1>" + (left ? "End of the queue" : "Task complete") + "</h1>"
    + "<p>" + esc(message) + "</p><div class='tallies'>"
    + "<div class='tally'><strong>" + done + "</strong>judged</div>"
    + "<div class='tally'><strong>" + rejected + "</strong>rejected</div>"
    + "<div class='tally'><strong>" + left + "</strong>left</div></div>"
    + "<div class='done-actions'>"
    + (left ? "<button id='firstgap' type='button'>First unjudged item</button>" : "")
    + "<button id='undodone' type='button'>Undo last judgment</button>"
    + "<a href='/?rater=" + esc(RATER_ID) + "'>All tasks</a></div>" + renderAboutJudgement() + "</section>";
  var firstGap = document.getElementById("firstgap");
  if (firstGap) firstGap.addEventListener("click", function () { idx = firstUnjudged(); app.className = "workspace"; render(true); });
  document.getElementById("undodone").addEventListener("click", function () { app.className = "workspace"; undo(); });
}

document.addEventListener("keydown", function (event) {
  var tag = event.target && event.target.tagName;
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (IS_METHODS) return;
  if (rejectOpen) {
    if (event.key === "Escape") { event.preventDefault(); closeReject(); return; }
    if (event.key === "Tab") {
      var focusable = Array.prototype.filter.call(
        rejectOverlay.querySelectorAll("button:not([disabled]), input:not([disabled])"),
        function (element) { return element.offsetParent !== null; }
      );
      if (focusable.length) {
        var firstFocus = focusable[0];
        var lastFocus = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === firstFocus) { event.preventDefault(); lastFocus.focus(); }
        else if (!event.shiftKey && document.activeElement === lastFocus) { event.preventDefault(); firstFocus.focus(); }
      }
      return;
    }
    if (shortcutsEnabled && /^[1-6]$/.test(event.key)) {
      event.preventDefault();
      var reason = task.reject_reasons[parseInt(event.key, 10) - 1];
      if (reason) chooseReason(reason);
    }
    return;
  }
  if (shortcutsEnabled && event.key === "?") { event.preventDefault(); toggleAbout(); return; }
  if (!shortcutsEnabled) {
    if (event.key === "Escape") location.href = "/?rater=" + encodeURIComponent(RATER_ID);
    return;
  }
  if (!task || busy || idx >= task.items.length) {
    if (event.key.toLowerCase() === "z") { event.preventDefault(); undo(); }
    return;
  }
  var upper = event.key.toUpperCase();
  var shortcutIndex = SHORTCUTS.indexOf(upper);
  if (shortcutIndex >= 0 && shortcutIndex < task.options.length) {
    event.preventDefault();
    saveLabel(task.options[shortcutIndex]);
    return;
  }
  if (upper === "R") { event.preventDefault(); openReject(); }
  if (upper === "S") { event.preventDefault(); skip(); }
  if (upper === "Z") { event.preventDefault(); undo(); }
  if (upper === "N") { event.preventDefault(); openNote(); }
  if (event.key === "Escape") location.href = "/?rater=" + encodeURIComponent(RATER_ID);
});

if (IS_METHODS) loadMethods();
else load();
</script>
</body>
</html>
